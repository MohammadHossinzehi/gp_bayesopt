[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"

[project]
name = "gpbo"
version = "0.1.0"
description = "Gaussian process regression and Bayesian optimisation implemented from scratch with NumPy and SciPy"
readme = "README.md"
requires-python = ">=3.9"
license = { text = "MIT" }
dependencies = ["numpy>=1.22", "scipy>=1.8"]

[project.optional-dependencies]
dev = ["pytest>=7", "matplotlib>=3.5"]

[tool.setuptools]
packages = ["gpbo"]

[tool.pytest.ini_options]
testpaths = ["tests"]
